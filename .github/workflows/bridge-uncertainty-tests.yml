name: bridge-uncertainty tests
on:
  push:
    paths: ["research/bridge-uncertainty/**", ".github/workflows/bridge-uncertainty-tests.yml"]
  pull_request:
    paths: ["research/bridge-uncertainty/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/bridge-uncertainty
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pandas scikit-learn matplotlib tabulate pytest
      - run: python -m pytest -q
